name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        type: choice
        options:
          - Release
          - Debug
      version_major:
        description: Version major
        required: false
        type: string
      version_minor:
        description: Version minor
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy experimental release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build Cemu
        env:
          ANDROID_STORE_FILE_BASE64: ${{ secrets.ANDROID_STORE_FILE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EMULATOR_VERSION_MAJOR: ${{ inputs.version_major }}
          EMULATOR_VERSION_MINOR: ${{ inputs.version_minor }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          cd ./src/android

          BUILD_TYPE_NORMALIZED="$(printf '%s' "${BUILD_TYPE:-Release}" | tr '[:upper:]' '[:lower:]')"

          # Cemu v0.2 disables the standard release variant and defines
          # a custom "github" variant for distributable APK builds.
          case "$BUILD_TYPE_NORMALIZED" in
            release|github)
              GRADLE_TASK="assembleGithub"
              ;;
            debug)
              GRADLE_TASK="assembleDebug"
              ;;
            *)
              echo "::error::Unsupported build type: $BUILD_TYPE"
              echo "Use Release or Debug."
              exit 1
              ;;
          esac

          if [[ -n "${ANDROID_STORE_FILE_BASE64:-}" ]]; then
            if [[ -z "${ANDROID_KEY_STORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" ]]; then
              echo "::error::Keystore secret is present but password or alias is missing."
              exit 1
            fi
            printf '%s' "$ANDROID_STORE_FILE_BASE64" | base64 --decode > store.jks
            export ANDROID_KEYSTORE_FILE="$(pwd)/store.jks"
          else
            echo "[INFO] Signing secrets are not configured; building the github variant with the project's debug fallback."
            unset ANDROID_KEYSTORE_FILE
          fi

          echo "[INFO] Requested build type: $BUILD_TYPE_NORMALIZED"
          echo "[INFO] Executing Gradle task: $GRADLE_TASK"
          ./gradlew "$GRADLE_TASK"

      - name: Set version dependent vars
        env:
          EMULATOR_VERSION_MAJOR: ${{ inputs.version_major }}
          EMULATOR_VERSION_MINOR: ${{ inputs.version_minor }}
        run: |
          echo "CEMU_VERSION=$EMULATOR_VERSION_MAJOR.$EMULATOR_VERSION_MINOR" >> $GITHUB_ENV

      - name: Create release
        run: |
          VERSION=${{ env.CEMU_VERSION }}
          mkdir upload
          APK_PATH=$(find ./src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::No APK was generated."
            exit 1
          fi
          mv "$APK_PATH" "upload/Cemu-$VERSION.apk"
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          echo "[INFO] Release tag: v${{ env.CEMU_VERSION }}"
          RELEASE_BODY=$(printf "Experimental release %s" "${{ env.CEMU_VERSION }}")
          ghr_v0.15.0_linux_amd64/ghr -b "$RELEASE_BODY" -t ${{ secrets.GITHUB_TOKEN }} -n "Cemu ${{ env.CEMU_VERSION }}" "${{ env.CEMU_VERSION }}" ./upload
